<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hypit 视频助手</title><link rel="stylesheet" href="/style.css?v=20260928-question1"></head>
<body><main><header><div class="brand">H<span>·</span></div><div><h1>Hypit 视频助手</h1><p>参考视频复刻，也支持根据文字或图片创作。</p></div></header>
<section id="account" hidden><span id="account-name"></span> <button id="logout" type="button">退出登录</button> <button id="admin-open" type="button" hidden>服务状态</button></section>
<section class="card" id="admin-panel" hidden><h2>服务状态与异常任务</h2><div id="admin-state"></div></section>
<section class="card" id="login" hidden><h2>内部登录</h2><form id="login-form"><label>用户名<input id="username" autocomplete="username" required></label><label>访问令牌<input id="token" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><p id="login-message" role="status"></p></form></section>
<section class="card question-card" id="question-card" hidden aria-live="polite"><h2>当前任务需要补充说明</h2><p id="question-text"></p><form id="answer-form"><label for="answer-text">你的回答</label><textarea id="answer-text" maxlength="3000" required placeholder="请按上面的问题说明替换哪个角色，或明确说明全部替换。"></textarea><button id="answer-submit" type="submit">提交补充说明并继续</button><p id="answer-message" role="status"></p></form></section>
<section class="card"><h2>创建视频</h2><form id="form"><label>补充要求（可选）<textarea id="prompt" maxlength="3000" placeholder="例如：把参考视频里的角色换成图片中的商品，保留动作和镜头节奏。也可以不填。"></textarea></label><div class="row"><label>成片时长<select id="duration"><option value="" selected>自动（有参考时跟随参考）</option><option value="8">8 秒</option><option value="15">15 秒</option><option value="20">20 秒</option><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select><small>有参考时默认沿用参考时长，无参考时按内容规划。</small></label><label>画幅<select id="ratio"><option value="" selected>自动</option><option value="16:9">横屏 16:9</option><option value="9:16">竖屏 9:16</option><option value="1:1">方形 1:1</option></select></label></div><label>时长精度<select id="timing-mode"><option value="strict">按目标时长</option><option value="approximate">允许前后约 1 秒差异</option></select></label><label>图片（可选，最多 6 张）<input id="images" type="file" accept="image/*" multiple><small>支持商品、玩偶、场景或风格参考；本轮暂不支持真人出镜素材。</small></label><label>参考视频（可选）<input id="reference" type="file" accept="video/*"><small>首版支持本地视频文件，最长 180 秒、最大 150MB。</small></label><button id="submit" type="submit">生成视频</button><p id="message" role="status"></p></form></section>
<section class="card" id="current" hidden><div class="cardhead"><h2>当前任务</h2><span id="status"></span></div><p id="jobtext"></p><p id="error"></p><div id="events"></div><details><summary>各阶段累计耗时</summary><div id="timings"></div></details><div id="plan"></div><video id="result" controls playsinline hidden></video><a id="download" hidden>下载成片</a></section>
<section class="card"><h2>最近任务</h2><div id="jobs"></div></section></main><script src="/app.js?v=20260928-question1"></script></body></html>
